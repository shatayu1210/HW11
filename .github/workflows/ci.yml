name: CI for Iris MLOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test model loading and prediction
      run: |
        python -c "import joblib; model = joblib.load('model.pkl'); print(model.predict([[5.1, 3.5, 1.4, 0.2]]))"
